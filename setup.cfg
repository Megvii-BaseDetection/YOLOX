[isort]
line_length = 100
multi_line_output = 3
balanced_wrapping = True
known_third_party = setuptools,tqdm,loguru,tabulate,psutil,packaging
known_data_processing = cv2,numpy,scipy,PIL,matplotlib
known_datasets = pycocotools
known_deeplearning = torch,torchvision,caffe2,onnx,apex,timm,torch2trt,tensorrt,openvino,onnxruntime
known_myself = yolox
sections = FUTURE,STDLIB,THIRDPARTY,DATA_PROCESSING,DATASETS,DEEPLEARNING,MYSELF,FIRSTPARTY,LOCALFOLDER
no_lines_before=STDLIB,THIRDPARTY,DATASETS
default_section = FIRSTPARTY

[flake8]
max-line-length = 100
max-complexity = 18
exclude = __init__.py
