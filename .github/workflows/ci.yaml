name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python-version: ["3.13.7", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: python -m pip install "poetry>=2.3,<3"
      - name: Install locked CPU dependencies
        run: poetry sync
      - name: Validate package and tests
        run: |
          poetry check --lock
          poetry run pytest -q
          poetry build
          poetry run python -m yolox.tools.train --help
          poetry run python -m yolox.tools.eval --help
      - name: Lint
        run: poetry run flake8 yolox exps tools
